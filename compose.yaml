services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=linkdb'
      - 'POSTGRES_PASSWORD=ram123'
      - 'POSTGRES_USER=ram'
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: 'redis:latest'
    ports:
      - '6379'
volumes:
  postgres_data:
