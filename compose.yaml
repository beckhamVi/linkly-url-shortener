services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: 'redis:latest'
    ports:
      - '6379'
volumes:
  postgres_data:
